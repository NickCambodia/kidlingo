<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF4FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kidlingo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Kidlingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+Khmer:wght@500;700&display=swap">
<style>
/* Layout: one-screen kid app on a Japanese school-notebook ground; big tactile buttons, masu practice squares, teacher's red hanamaru + hanko as rewards. Single light theme by choice. */
:root{
  --paper:#EEF4FA; --card:#FFFFFF; --ink:#1E2A45; --muted:#5E6E8A; --line:#D3DEEA;
  --shu:#E0452B; --leaf:#2E9E64; --sun:#F2B233; --sky:#3B82D6; --plum:#8A57C9;
  --font:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;
  --kana:'Klee One','Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;font-weight:500;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;background-position:0 -1px}
#app{height:100%;display:flex;flex-direction:column;max-width:780px;margin:0 auto;padding-inline:16px}
button{font:inherit;color:inherit}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.kana{font-family:var(--kana);font-weight:600}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;padding-block:12px 6px}
.spacer{flex:1}
.icon-btn{width:50px;height:50px;flex:none;border-radius:16px;border:0;background:var(--card);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;cursor:pointer;font-size:22px;font-weight:900}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.counter{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:5px 14px 5px 7px;font-weight:900;font-size:21px;font-variant-numeric:tabular-nums;box-shadow:0 4px 0 var(--line)}
.counter small{font-size:13px;color:var(--muted);font-weight:700}
.hm{color:var(--shu);flex:none}
.hm.faded{color:var(--line)}
main{flex:1;min-height:0;overflow-y:auto;padding-block:10px 28px}

/* buttons */
.btn{font-weight:900;font-size:22px;border:0;border-radius:20px;padding:12px 24px;min-height:62px;background:var(--card);box-shadow:0 5px 0 var(--line);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--leaf);color:#fff;box-shadow:0 5px 0 #1F6E45}
.btn.primary:active{box-shadow:0 1px 0 #1F6E45}
.btn.round{width:62px;padding:0;display:grid;place-items:center;color:var(--sky)}
.nav-row{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.nav-row.center{justify-content:center}
.count{font-weight:900;font-size:20px;color:var(--muted);font-variant-numeric:tabular-nums}

/* pictures */
.emo{line-height:1;display:inline-block}
.emo.xl{font-size:clamp(96px,30vw,168px)}
.emo.l{font-size:clamp(58px,17vw,104px)}
.emo.m{font-size:clamp(44px,11vw,64px)}
.emo.s{font-size:clamp(36px,10vw,54px)}
.swatch{display:inline-block;border-radius:50%;background:var(--sw);border:4px solid #E3E9F1;aspect-ratio:1;max-width:100%}
.swatch.xl{width:clamp(110px,34vw,180px)} .swatch.l{width:clamp(66px,20vw,112px)} .swatch.m{width:54px} .swatch.s{width:clamp(40px,11vw,58px)}
.dots{display:inline-grid;grid-template-columns:repeat(var(--cols),auto);gap:8px;justify-content:center}
.dots i{display:block;border-radius:50%;background:var(--shu)}
.dots.xl i{width:clamp(22px,7vw,36px);aspect-ratio:1} .dots.l i{width:clamp(14px,4.2vw,22px);aspect-ratio:1} .dots.m i{width:10px;aspect-ratio:1} .dots.s i{width:clamp(8px,2.4vw,12px);aspect-ratio:1}
.dots.s{gap:4px}

/* home */
.hello{font-size:clamp(26px,6vw,36px);font-weight:900;margin:6px 0 18px;text-wrap:balance}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tile .emo{font-size:clamp(30px,8vw,56px)}
.tile-talk{background:color-mix(in srgb,var(--leaf) 18%,var(--card));box-shadow:0 6px 0 color-mix(in srgb,var(--leaf) 60%,var(--card))}
.ph{font-size:clamp(28px,8vw,46px)!important;line-height:1.25!important;text-align:center;text-wrap:balance;letter-spacing:.02em}
.talk-card .ph{font-size:clamp(26px,7vw,40px)!important}
.scene{background:var(--card);border-radius:28px;box-shadow:0 5px 0 var(--line);display:grid;place-items:center;padding:20px;margin-bottom:16px}
.say-opts{display:flex;flex-direction:column;gap:12px}
.say-row{display:flex;gap:10px;align-items:center}
.spk.small{width:52px;height:52px}
.spk.small svg{width:24px;height:24px}
.say-opt{flex:1;min-width:0;border:0;background:var(--card);border-radius:20px;box-shadow:0 5px 0 var(--line);min-height:62px;padding:10px 16px;font-size:clamp(22px,6vw,30px);text-align:left;cursor:pointer}
.say-opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.say-opt.right{background:color-mix(in srgb,var(--leaf) 18%,var(--card));box-shadow:0 0 0 5px var(--leaf)}
.say-opt.wrong{opacity:.3}
.tile{border:0;border-radius:28px;min-height:170px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;padding:18px;transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(5px)}
.tile-words{background:color-mix(in srgb,var(--sun) 28%,var(--card));box-shadow:0 6px 0 color-mix(in srgb,var(--sun) 70%,var(--ink) 10%)}
.tile-write{background:color-mix(in srgb,var(--sky) 18%,var(--card));box-shadow:0 6px 0 color-mix(in srgb,var(--sky) 60%,var(--card))}
.tile-stick{background:color-mix(in srgb,var(--plum) 16%,var(--card));box-shadow:0 6px 0 color-mix(in srgb,var(--plum) 55%,var(--card))}
.tile:active{box-shadow:0 1px 0 var(--line)}
.tile-art{display:flex;gap:6px;align-items:center;justify-content:center;min-height:84px}
.big-a{font-size:84px;line-height:1;color:var(--sky)}
.tile-label{font-size:clamp(22px,6vw,30px);font-weight:900}
.big-a{font-size:clamp(56px,16vw,84px)!important}

.screen-title{font-size:32px;font-weight:900;margin:4px 0 14px}
.sub{color:var(--muted);font-weight:700;font-size:18px;margin:0 0 12px}

/* theme grid */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.theme-card{position:relative;border:0;border-radius:24px;background:var(--card);box-shadow:0 5px 0 var(--line);padding:18px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;border-top:8px solid var(--tc)}
.theme-card:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.theme-name{font-size:24px;font-weight:900}
.meter{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.meter i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.meter i.on{background:var(--leaf)}
.done-mark{position:absolute;top:8px;right:8px}

/* lesson */
.steps{display:flex;gap:4px;margin-bottom:14px}
.steps i{flex:1;height:10px;border-radius:6px;background:var(--line)}
.steps i.done{background:var(--leaf)}
.steps i.now{background:var(--sun)}
.prompt{display:flex;align-items:center;gap:14px;margin-bottom:14px;min-height:64px}
.prompt-text{font-size:clamp(22px,5.5vw,30px);font-weight:900;text-wrap:balance}
.spk{width:64px;height:64px;flex:none;border-radius:50%;border:0;background:var(--sky);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 #28609F}
.spk:active{transform:translateY(4px);box-shadow:0 1px 0 #28609F}
.spk.hint{background:var(--card);color:var(--sky);box-shadow:0 5px 0 var(--line)}
.read-word{font-size:clamp(52px,15vw,84px);line-height:1.1;letter-spacing:.04em}
.learn-card{width:100%;border:0;background:var(--card);border-radius:32px;box-shadow:0 6px 0 var(--line);min-height:clamp(260px,55vw,380px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:pointer;padding:24px}
.learn-card .word{font-size:clamp(44px,12vw,68px);line-height:1}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.choice{border:0;background:var(--card);border-radius:26px;box-shadow:0 5px 0 var(--line);height:clamp(130px,32vw,200px);display:grid;place-items:center;cursor:pointer;transition:transform .08s}
.choice:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.choice.right{background:color-mix(in srgb,var(--leaf) 18%,var(--card));box-shadow:0 0 0 5px var(--leaf)}
.choice.wrong{opacity:.3}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:560px){.mgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mcard{border:0;border-radius:18px;aspect-ratio:1;background:color-mix(in srgb,var(--sky) 16%,var(--card));box-shadow:0 4px 0 var(--line);display:grid;place-items:center;cursor:pointer;padding:6px;min-width:0}
.mcard .face{display:none}
.mcard.up{background:var(--card)}
.mcard.up .face{display:grid;place-items:center}
.mcard.up .back{display:none}
.mcard.got{box-shadow:0 0 0 4px var(--leaf);background:color-mix(in srgb,var(--leaf) 12%,var(--card))}
.mcard .back .hm{color:color-mix(in srgb,var(--sky) 40%,var(--card))}
.mword{font-size:clamp(22px,6.5vw,34px);line-height:1.1;word-break:keep-all;text-align:center}
.talk-card{background:var(--card);border-radius:32px;box-shadow:0 6px 0 var(--line);padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.grown-up{font-size:15px;color:var(--muted);line-height:1.6;max-width:44ch;text-align:center;margin:0}
.grown-up b{color:var(--ink)}
.linkish{border:0;background:none;color:var(--sky);font-weight:700;text-decoration:underline;cursor:pointer;padding:0 2px}

/* finish */
.finish{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:20px}
.stamp-wrap{width:min(220px,60vw)}
.hanko{width:100%;height:auto;color:var(--shu);font-family:var(--font);transform:rotate(-10deg);opacity:.92;animation:stamp .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stamp{from{transform:rotate(-10deg) scale(1.9);opacity:0}to{transform:rotate(-10deg) scale(1);opacity:.92}}
.earned{display:flex;align-items:center;gap:8px;font-size:36px;font-weight:900;margin:0;font-variant-numeric:tabular-nums}

/* kana grid + trace */
.kgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-width:460px}
.kcell{position:relative;border:0;aspect-ratio:1;border-radius:14px;background:var(--card);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;cursor:pointer;font-size:clamp(26px,8vw,38px);min-width:0}
.kcell.blank{background:transparent;box-shadow:none}
.kcell.done{background:color-mix(in srgb,var(--shu) 7%,var(--card))}
.kmark{position:absolute;top:2px;right:2px;line-height:0}
.seg{display:inline-flex;background:var(--card);border-radius:999px;padding:5px;gap:4px;box-shadow:0 4px 0 var(--line);margin-bottom:12px}
.seg-btn{border:0;background:transparent;border-radius:999px;padding:10px 20px;font-size:22px;font-weight:900;cursor:pointer;color:var(--muted)}
.seg-btn.on{background:var(--sky);color:#fff}
.kata-badge{font-size:13px;color:var(--sky);background:color-mix(in srgb,var(--sky) 12%,var(--card));border-radius:999px;padding:2px 10px}
.kata-a{color:var(--plum)}
.pair{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;color:var(--muted);margin:10px 0 0;font-size:18px}
.pair-chip{border:0;background:var(--card);border-radius:12px;box-shadow:0 3px 0 var(--line);font-size:28px;width:52px;height:52px;cursor:pointer;color:var(--ink)}
.mean-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;min-height:48px}
.qbtn{width:48px;height:48px;border-radius:50%;border:3px solid var(--sky);background:var(--card);color:var(--sky);font-size:24px;font-weight:900;cursor:pointer;flex:none}
.qbtn[aria-expanded="true"]{background:var(--sky);color:#fff}
.meaning{font-size:22px;font-weight:700;color:var(--muted);background:var(--card);border-radius:14px;padding:8px 16px;box-shadow:0 3px 0 var(--line)}
.ro{color:var(--sky);font-size:15px;font-weight:700;margin-left:6px}
.warn-btn{color:var(--shu)}
.help{margin:0 0 12px;padding-left:20px;line-height:1.5;color:var(--ink)}
.help li{margin-bottom:6px}
.diag{font-size:12px;color:var(--muted);word-break:break-word}
.trace-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.masu-wrap{position:relative;width:min(100%,380px);aspect-ratio:1;margin:0 auto;max-width:100%}
#masu{display:block;touch-action:none;border-radius:12px;box-shadow:0 5px 0 var(--line);background:#fff}
.tstamp{position:absolute;right:-6px;bottom:-6px;width:42%;pointer-events:none;mix-blend-mode:multiply}
.stroke-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;font-size:22px;font-weight:900}
.sdots{display:flex;gap:6px;margin-left:6px}
.sdots i{width:16px;height:16px;border-radius:50%;border:3px solid var(--sky)}
.sdots i.on{background:var(--sky)}
.stroke-row.over .sdots i{border-color:var(--sun);background:var(--sun)}

/* stickers */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px}
.sticker{background:var(--card);border-radius:22px;box-shadow:0 4px 0 var(--line);padding:16px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.sticker .emo{font-size:54px;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 3px 4px rgba(30,42,69,.25))}
.sticker.locked .emo{filter:brightness(0) opacity(.12)}
.sticker small{font-size:14px;font-weight:700;color:var(--muted);line-height:1.3}

/* parent */
.parent{max-width:65ch;line-height:1.55}
.parent h1{font-size:30px;font-weight:900;margin:4px 0 4px}
.parent h2{font-size:20px;font-weight:900;margin:30px 0 10px;letter-spacing:.01em}
.parent .lede{color:var(--muted);margin:0 0 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:0 3px 0 var(--line)}
.stat b{display:block;font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.trow{display:grid;grid-template-columns:34px minmax(0,7em) minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.trow .emo{font-size:26px}
.bar-track{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar-fill{height:100%;background:var(--leaf);border-radius:6px}
.trow small{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:0;border-radius:999px;padding:6px 12px;box-shadow:0 3px 0 var(--line);cursor:pointer;font-size:20px}
.chip small{font-family:var(--font);font-size:12px;color:var(--shu);font-weight:700}
.empty{color:var(--muted);background:var(--card);border-radius:14px;padding:12px 14px;margin:0}
details{background:var(--card);border-radius:14px;padding:10px 14px;margin-bottom:8px;box-shadow:0 3px 0 var(--line)}
summary{font-weight:900;cursor:pointer}
.phrase{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.phrase:first-of-type{border-top:0}
.phrase .kana{font-size:19px}
.phrase .en{grid-column:2;color:var(--muted);font-size:14px}
.phrase .chip{grid-row:span 2;font-size:14px;padding:6px 10px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set label{font-weight:700}
.set input[type=checkbox]{width:26px;height:26px;accent-color:var(--leaf)}
.set select{font:inherit;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.small-btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 16px;background:var(--card);box-shadow:0 3px 0 var(--line);cursor:pointer}
.small-btn.danger{color:var(--shu)}
.warn{color:var(--shu);font-weight:700}
.note{color:var(--muted);font-size:14px}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(30,42,69,.45);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--card);border-radius:24px;padding:22px;width:min(360px,100%);box-shadow:0 10px 40px rgba(30,42,69,.3)}
.modal h2{margin:0 0 4px;font-size:22px;font-weight:900}
.modal p{margin:0 0 12px;color:var(--muted)}
.gate-q{display:block;font-size:30px;font-weight:900;margin:8px 0;font-variant-numeric:tabular-nums}
#gateIn{font:inherit;font-size:28px;font-weight:900;width:100%;padding:10px 14px;border-radius:14px;border:3px solid var(--line);background:var(--paper);color:var(--ink);box-sizing:border-box}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.modal .btn{font-size:18px;min-height:50px;padding:8px 18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card);border-radius:22px;padding:12px 22px;box-shadow:0 8px 30px rgba(30,42,69,.25);display:flex;align-items:center;gap:12px;font-size:22px;font-weight:900;z-index:30;animation:pop .35s cubic-bezier(.2,1.5,.4,1) both;transition:opacity .4s}
.toast .emo{font-size:44px}
.toast.out{opacity:0}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 2026-10 refinements ---------- */
[hidden]{display:none!important}   /* .icon-btn etc. set display, which used to override the hidden attribute */
#app{height:100dvh}
.bar{padding-top:calc(12px + env(safe-area-inset-top,0px))}
.toast{white-space:nowrap}

/* phrase scenes: who says it (speech bubble), when (sun or dusk), and which way they go (arrow) */
.scn{position:relative;display:inline-flex;align-items:flex-end;justify-content:center;gap:.14em;padding-top:.95em;line-height:1}
.scn.xl{font-size:clamp(46px,13vw,72px)} .scn.l{font-size:clamp(17px,4.7vw,30px)} .scn.m{font-size:30px} .scn.s{font-size:clamp(15px,4.4vw,23px)}
.scn .emo{font-size:1em}
.scn-s{position:relative;display:inline-flex;flex-direction:column;align-items:center}
.scn-s.arr .emo{font-size:.55em;margin-bottom:.4em}
.scn-s.sp > .emo{filter:drop-shadow(0 0 .07em var(--sun)) drop-shadow(0 0 .07em var(--sun))}
.bub{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:.12em;background:#fff;border:.06em solid var(--ink);border-radius:1em;padding:.16em .3em;display:flex;gap:.12em;align-items:center;font-size:.42em;line-height:1}
.bub::after{content:'';position:absolute;top:100%;left:38%;border:.22em solid transparent;border-top-color:var(--ink)}
.bub i{width:.34em;height:.34em;border-radius:50%;background:var(--ink);animation:talk 1.2s infinite}
.bub i:nth-child(2){animation-delay:.2s} .bub i:nth-child(3){animation-delay:.4s}
.bub.sub{border-color:var(--muted);font-size:.36em;opacity:.8}
.bub.sub::after{border-top-color:var(--muted)}
@keyframes talk{0%,60%,100%{opacity:.25}30%{opacity:1}}
.scn-t{position:absolute;top:0;left:-.25em;font-size:.5em}

/* the journey (home) */
.free{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:2px 0 12px}
.fp{border:0;border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--line);padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900;font-size:clamp(13px,3.6vw,17px);cursor:pointer;min-width:0}
.fp .emo,.fp .kana{font-size:clamp(22px,6vw,30px);line-height:1.1}
.fp .kana{color:var(--sky)}
.fp:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.journey{position:relative}
.jband{position:absolute;left:0;right:0;background:var(--bg);border-radius:28px}
.jregion{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:4px 16px 4px 8px;box-shadow:0 4px 0 rgba(30,42,69,.12);font-weight:900;font-size:clamp(19px,5.2vw,25px);white-space:nowrap;z-index:3}
.jregion .emo{font-size:1.5em}
.jtrack{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:1}
.jtrack path{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.jtrack .bed{stroke:#A88563;stroke-width:16}
.jtrack .ties{stroke:#F3E7D3;stroke-width:9;stroke-dasharray:3 9;stroke-linecap:butt}
.jtrack .got{stroke:var(--shu);stroke-width:5}
.jstart,.jgoal{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:5px 18px 5px 10px;font-weight:900;font-size:20px;box-shadow:0 4px 0 var(--line);white-space:nowrap;z-index:2}
.jstart{top:4px} .jstart .emo,.jgoal .emo{font-size:30px}
.stop{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;width:112px;display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:2}
.k-words{--kc:var(--sun);--kc-d:#C98A12} .k-talk{--kc:var(--leaf);--kc-d:#1F6E45} .k-write{--kc:var(--sky);--kc-d:#28609F}
.disc{width:76px;height:76px;border-radius:50%;background:var(--card);display:grid;place-items:center;border:5px solid var(--kc);box-shadow:0 6px 0 var(--kc-d);font-size:38px;line-height:1;transition:transform .08s}
.disc .kana{font-size:40px;color:var(--kc-d)}
.stop:active .disc{transform:translateY(4px)}
.stop.done .disc{background:color-mix(in srgb,var(--kc) 20%,var(--card))}
.stop.now .disc{width:94px;height:94px;font-size:48px;animation:nowp 1.8s ease-in-out infinite}
.stop.now .disc .kana{font-size:50px}
@keyframes nowp{0%,100%{box-shadow:0 6px 0 var(--kc-d),0 0 0 0 color-mix(in srgb,var(--kc) 60%,transparent)}50%{box-shadow:0 6px 0 var(--kc-d),0 0 0 16px color-mix(in srgb,var(--kc) 0%,transparent)}}
.stop.lock .disc{filter:grayscale(1);opacity:.5;border-color:#C5CFDB;box-shadow:0 5px 0 #C5CFDB}
.stop.waiting .disc{animation:none}
.stop.arrive .disc{animation:spop .55s cubic-bezier(.2,1.6,.4,1),nowp 1.8s ease-in-out .55s infinite}
@keyframes spop{from{transform:scale(.5)}to{transform:scale(1)}}
.snum{position:absolute;top:-4px;right:14px;min-width:26px;height:26px;border-radius:13px;background:var(--ink);color:#fff;font-size:14px;font-weight:900;display:grid;place-items:center;padding:0 6px}
.stop.now .snum{right:4px}
.stop.lock .snum{background:#9AA8BB}
.sname{margin-top:6px;background:var(--card);border-radius:10px;padding:1px 8px;font-size:15px;white-space:nowrap;box-shadow:0 2px 0 var(--line)}
.stop.lock .sname{opacity:.55}
.sstars{display:flex;gap:1px;margin-top:4px;background:var(--card);border-radius:10px;padding:2px 4px;box-shadow:0 2px 0 var(--line)}
.sstars i{display:block;line-height:0} .sstars .hm{color:#D8DFE8} .sstars i.on .hm{color:var(--shu)}
.train{position:absolute;font-size:42px;line-height:1;transform:translate(-50%,-232%);transition:left 1.3s ease-in-out,top 1.3s ease-in-out;pointer-events:none;filter:drop-shadow(0 3px 0 rgba(30,42,69,.2));z-index:4}
.train.ride{animation:bob .22s ease-in-out infinite alternate}
@keyframes bob{to{margin-top:-5px}}
.gobar{position:sticky;bottom:0;z-index:5;display:flex;justify-content:center;padding:18px 0 calc(4px + env(safe-area-inset-bottom,0px));margin-top:-12px;background:linear-gradient(transparent,var(--paper) 45%)}
.go-next{display:flex;align-items:center;justify-content:center;gap:12px;font-size:26px;width:min(340px,100%)}
.go-next .emo,.go-next .kana{font-size:34px;line-height:1;color:#fff}

/* finish: 1-3 はなまる */
.fstars{display:flex;gap:8px}
.fstars span{line-height:0;animation:spop .45s cubic-bezier(.2,1.6,.4,1) var(--d) both}
.fstars .hm{color:#D8DFE8} .fstars span.on .hm{color:var(--shu)}

/* a kana row on the journey */
.row-dots{display:flex;justify-content:center;gap:8px;margin-bottom:10px}
.row-dots span{font-size:24px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--card);box-shadow:0 3px 0 var(--line);color:var(--muted)}
.row-dots .now{background:var(--sky);color:#fff;box-shadow:0 3px 0 #28609F}
.row-dots .done{color:var(--shu)}

/* hear yourself */
.rec-row{display:flex;gap:14px;justify-content:center}
.btn.round .emo{font-size:30px}
.btn.round.mic.on{background:var(--shu);box-shadow:0 5px 0 #A9301C;animation:recp 1s ease-in-out infinite}
@keyframes recp{50%{transform:scale(1.08)}}
.bk{display:flex;gap:8px}
.bk label{cursor:pointer}

/* phrase answers: one wide column, so a scene (who speaks, which way they go) is big enough to read */
.choices.wide{grid-template-columns:1fr;gap:10px}
.choices.wide .choice{height:clamp(84px,22vw,120px)}
.choices.wide .scn.l{font-size:clamp(26px,7.4vw,40px)}
.choices.wide .emo.l{font-size:clamp(40px,11vw,64px)}

/* ---------- beautify (2026-10) ---------- */
#view{--tc:var(--sky)}
/* free play: each in its own colour */
.fp-words{background:color-mix(in srgb,var(--sun) 26%,var(--card));box-shadow:0 4px 0 color-mix(in srgb,var(--sun) 65%,var(--card))}
.fp-talk{background:color-mix(in srgb,var(--leaf) 18%,var(--card));box-shadow:0 4px 0 color-mix(in srgb,var(--leaf) 55%,var(--card))}
.fp-write{background:color-mix(in srgb,var(--sky) 16%,var(--card));box-shadow:0 4px 0 color-mix(in srgb,var(--sky) 50%,var(--card))}
.fp-stick{background:color-mix(in srgb,var(--plum) 15%,var(--card));box-shadow:0 4px 0 color-mix(in srgb,var(--plum) 50%,var(--card))}
/* scenery along the journey */
.jdeco{position:absolute;transform:translate(-50%,-50%);font-size:clamp(26px,7vw,36px);line-height:1;z-index:1;pointer-events:none;opacity:.92;filter:drop-shadow(0 2px 0 rgba(255,255,255,.7))}
.jband{box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.jtrack .bed{stroke:#A88563}
/* lesson progress: a train on a rail */
.rail{position:relative;height:34px;margin:2px 26px 12px 4px}
.rail-track{position:absolute;left:0;right:0;top:16px;height:10px;border-radius:6px;background:#DCE4EE;overflow:hidden;box-shadow:inset 0 2px 0 rgba(30,42,69,.08)}
.rail-track i{display:block;height:100%;border-radius:6px;background:var(--tc);transition:width .5s ease}
.rail-train{position:absolute;top:-2px;font-size:28px;line-height:1;transform:translateX(-50%);transition:left .5s ease}
.rail-flag{position:absolute;right:-26px;top:2px;font-size:24px;line-height:1}
/* topic colour on lesson cards */
.learn-card,.talk-card,.scene{border-top:10px solid var(--tc);background:linear-gradient(color-mix(in srgb,var(--tc) 9%,var(--card)),var(--card) 45%)}
.choice,.say-opt{box-shadow:0 5px 0 color-mix(in srgb,var(--tc) 35%,var(--line))}
.mcard{background:color-mix(in srgb,var(--tc) 16%,var(--card))}
.mcard .back .hm{color:color-mix(in srgb,var(--tc) 45%,var(--card))}
.prompt-text{color:var(--ink)}

/* ---------- wide screens (2026-10) ---------- */
#app{max-width:1120px}
.page{max-width:780px;margin:0 auto}
.page.wide{max-width:none}
/* the kana chart: on a phone, rows of 5 (あいうえお across); on a wide screen, the classroom 五十音表 (あいうえおひょう):
   11 columns あ…ん, each read top to bottom, right to left. Same cells, only the flow changes. */
@media (min-width:820px){
  .page.wide .kgrid{max-width:none;grid-template-columns:none;grid-template-rows:repeat(5,minmax(0,1fr));grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);direction:rtl;gap:10px}
  .page.wide .kcell{font-size:clamp(30px,3.4vw,44px)}
  .page.wide .screen-title,.page.wide .seg,.page.wide > .sub{direction:ltr}
}
.bar{width:100%;max-width:780px;margin-inline:auto}
body.wide .bar{max-width:none}

/* the speed bar 🐢 ━━●━━ 🐇: three snap points, a big thumb for small fingers */
.speedbar{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin:-4px 0 4px}
.speedbar .emo{font-size:26px;line-height:1}
.spd{-webkit-appearance:none;appearance:none;width:130px;height:12px;border-radius:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--leaf) 45%,var(--card)),color-mix(in srgb,var(--sun) 55%,var(--card)));margin:0;cursor:pointer}
.spd::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;background:var(--card);border:4px solid var(--sky);box-shadow:0 3px 0 #28609F}
.spd::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--card);border:4px solid var(--sky);box-shadow:0 3px 0 #28609F}
.set .speedbar{margin:0}

/* ---------- writing a kana (2026-10): an SVG masu, never clipped; strokes from KanjiVG ---------- */
.masu-wrap{position:relative;width:min(100%,380px);aspect-ratio:1;margin:0 auto;border-radius:16px;background:#fff;box-shadow:0 5px 0 var(--line)}
.masu{display:block;width:100%;height:100%}
#masu{position:absolute;inset:0;display:block;touch-action:none;background:transparent;box-shadow:none;border-radius:16px}
.masu .mbox{fill:#fff;stroke:#B9C8DA;stroke-width:1.6}
.masu .mguide{fill:none;stroke:#D6E1EE;stroke-width:.8;stroke-dasharray:3 3}
.masu path.sg{fill:none;stroke:#DCE5EF;stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round}
.masu path.sink{fill:none;stroke:var(--ink);stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round}
.masu path.sanim{fill:none;stroke:var(--sky);stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round}
.masu path.sflash{fill:none;stroke:var(--sky);stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.masu .hdot{fill:var(--leaf);stroke:#fff;stroke-width:1.4;animation:hpulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.masu .hnum,.masu .anum{fill:#fff;font:700 6.5px var(--font);text-anchor:middle}
.masu .anum-bg{fill:var(--sky)}
.masu .harrow,.masu .harrowh{fill:none;stroke:var(--leaf);stroke-width:2.2;stroke-linecap:round}
@keyframes hpulse{50%{transform:scale(1.25)}}
.tstamp{position:absolute;right:4%;bottom:4%;width:40%;pointer-events:none;mix-blend-mode:multiply}
/* example words under the kana */
.kwords{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:14px}
.kw{display:flex;align-items:center;gap:8px;border:0;border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--line);padding:6px 14px 6px 8px;cursor:pointer;font-size:clamp(20px,5.4vw,26px)}
.kw .emo{font-size:1.5em}
.kw b{color:var(--shu);font-weight:600}
.kw:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tnav{flex-wrap:nowrap;gap:8px}
.tnav .btn{font-size:clamp(16px,4.4vw,20px);padding:10px clamp(10px,3vw,18px);white-space:nowrap}
.tnav .btn.round{flex:none}

/* ---------- sound lessons: long sounds ー and small っ (2026-10) ---------- */
.k-sound{--kc:var(--plum);--kc-d:#5E3A91}
.mk{color:var(--shu);font-weight:600}
.beats{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.beat{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:clamp(40px,11vw,60px);line-height:1}
.beat i{width:14px;height:14px;border-radius:50%;background:var(--tc)}
.scene .beats{margin-top:12px}
.scene .bword{font-size:clamp(40px,11vw,60px);line-height:1.1;margin-top:10px}
.scene{flex-direction:column}
.spell-opts{display:grid;gap:12px}
.spell-opt{border:0;border-radius:20px;background:var(--card);box-shadow:0 5px 0 color-mix(in srgb,var(--tc) 35%,var(--line));min-height:72px;font-size:clamp(30px,8vw,42px);letter-spacing:.06em;cursor:pointer}
.spell-opt:active:not(:disabled){transform:translateY(4px)}
.spell-opt.right{background:color-mix(in srgb,var(--leaf) 18%,var(--card));box-shadow:0 0 0 5px var(--leaf)}
.spell-opt.wrong{opacity:.3}
.beat-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.beat-opt{border:0;border-radius:20px;background:var(--card);box-shadow:0 5px 0 color-mix(in srgb,var(--tc) 35%,var(--line));padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:0}
.beat-opt .claps{font-size:clamp(16px,4.6vw,24px);line-height:1.2;text-align:center;word-break:break-all}
.beat-opt b{font-size:30px;font-weight:900}
.beat-opt.right{background:color-mix(in srgb,var(--leaf) 18%,var(--card));box-shadow:0 0 0 5px var(--leaf)}
.beat-opt.wrong{opacity:.3}

/* ---------- our family's voice (parent mode) ---------- */
.parent h3.sub3{font-size:17px;font-weight:900;margin:18px 0 4px}
.fam-add{display:grid;grid-template-columns:1fr;gap:8px;margin:8px 0 12px}
@media (min-width:560px){.fam-add{grid-template-columns:2fr 1fr 2fr auto}}
.fam-add input{font:inherit;font-size:17px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-width:0}
.frow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.frow .emo{font-size:28px;width:40px;text-align:center}
.ftext{flex:1;min-width:140px;display:flex;flex-direction:column}
.ftext .kana{font-size:19px} .ftext small{color:var(--muted);font-size:13px}
.fctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fok{color:var(--leaf);font-weight:700;font-size:13px}
.small-btn.rec-on{background:var(--shu);color:#fff}
.small-btn.quiet{color:var(--muted)}

/* Khmer meaning hints */
.km{font-family:'Noto Sans Khmer','Khmer Sangam MN',sans-serif;font-weight:500;line-height:1.6}

/* ---------- fit the phone (2026-10-09): the next step never leaves the screen ----------
   Lesson buttons dock at the bottom of the scrolling view; pictures and cards size by the screen height as well as
   the width, so on a short phone they shrink instead of pushing the buttons down. */
.page{min-height:100%;display:flex;flex-direction:column}
.nav-row.dock{position:sticky;bottom:0;z-index:4;margin-top:auto;padding:14px 0 calc(6px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(transparent,var(--paper) 30%);margin-bottom:-28px}
.nav-row.dock:not(.center):not(.tnav){flex-wrap:nowrap}
.page > .nav-row.dock{margin-top:auto}
.learn-card{min-height:clamp(200px,min(55vw,42vh),380px)}
.emo.xl{font-size:clamp(78px,min(30vw,19vh),168px)}
.learn-card .word{font-size:clamp(36px,min(12vw,8vh),68px)}
.scn.xl{font-size:clamp(38px,min(13vw,8.5vh),72px)}
.talk-card{padding:18px 16px;gap:10px}
.choice{height:clamp(104px,min(32vw,21vh),200px)}
.choices.wide .choice{height:clamp(70px,min(22vw,12vh),120px)}
.mgrid{gap:8px}
@media (max-height:780px){ .mgrid{grid-template-columns:repeat(4,minmax(0,1fr))} .mcard .back .hm{width:34px;height:34px} }
details.grown-up{max-width:44ch;text-align:center}
details.grown-up summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--muted)}
details.grown-up summary::-webkit-details-marker{display:none}
details.grown-up p{margin:8px 0 0;font-size:15px;line-height:1.6}
.qbtn.small{width:28px;height:28px;font-size:16px;display:inline-grid;place-items:center}
.masu-wrap{width:min(100%,380px,44vh)}
.kwords{flex-wrap:nowrap;gap:8px;margin-top:10px}
.kw{padding:4px 10px 4px 6px;font-size:clamp(17px,4.6vw,24px)}
.stroke-row{margin-top:8px}
/* choice screens (say / spell / beats): a smaller picture on short screens, so every answer is visible */
.scene{padding:clamp(10px,2vh,20px);margin-bottom:clamp(8px,1.6vh,16px)}
.scene .emo.xl{font-size:clamp(60px,min(28vw,14vh),150px)}
.scene .scn.xl{font-size:clamp(34px,min(12vw,7vh),68px)}
.scene .swatch.xl{width:clamp(80px,min(30vw,15vh),170px)}
@media (max-height:720px){
  .say-opts,.spell-opts{gap:9px} .say-opt{min-height:52px;padding:8px 14px} .spell-opt{min-height:56px}
  .prompt{min-height:54px;margin-bottom:8px} .rail{margin-bottom:6px} .learn-card{gap:10px} .mean-row{margin-top:8px;min-height:40px}
  .beat-opt{padding-block:8px}
}

/* ---------- phrase pictures (2026-10-09): picture-book scenes from src/art.js, 3:2 ----------
   Sized by the screen height too, so the buttons below stay on screen. The speaker's bubble dots pulse. */
.art{display:block;line-height:0;margin-inline:auto}
.art svg{display:block;width:100%;height:auto;border-radius:18px;box-shadow:0 0 0 1px var(--line)}
.art.xl{width:min(100%,440px,46vh)}
.scene .art.xl{width:min(100%,420px,34vh)}
.talk-card .art.xl{width:min(100%,440px,40vh)}
.art.l,.art.s{width:100%}
.choices.arts{gap:10px}
.choices.arts .choice{height:auto;padding:6px;border-radius:20px}
.choices.arts .art svg{border-radius:14px}
.art .kb-d{animation:talk 1.2s infinite}
.art .kb-d:nth-child(5){animation-delay:.2s} .art .kb-d:nth-child(6){animation-delay:.4s}
@media (prefers-reduced-motion:reduce){ .art .kb-d{animation:none} }
.learn-card:has(.art){min-height:0;padding:clamp(12px,2vh,22px);gap:clamp(8px,1.6vh,14px)}
.learn-card .art.xl{width:min(100%,440px,max(150px,calc((100dvh - 500px) * 1.5)))}
.talk-card .art.xl{width:min(100%,440px,34vh)}
@media (max-height:720px){
  .ph{font-size:clamp(22px,6.2vw,32px)!important} .talk-card .ph{font-size:clamp(22px,6vw,30px)!important}
  .say-opt{font-size:clamp(18px,5vw,24px)}
  .scene .art.xl{width:min(100%,420px,30vh)}
  .talk-card .art.xl{width:min(100%,440px,30vh)}
}

/* ---------- home: play buttons stay at the top, 🚃 back to the train (2026-10-09) ----------
   The journey scrolls inside <main>, so iPhone's tap-the-clock-to-scroll-up doesn't reach it: keep the four play
   buttons pinned (a slim row) and offer 🚃 when the train's stop is out of sight. */
.free{position:sticky;top:-10px;z-index:8;margin:-10px 0 6px;padding:10px 0 12px;background:linear-gradient(var(--paper) 78%,transparent)}
.fp{gap:0;padding:5px 2px 4px;border-radius:16px;font-size:clamp(12px,3.4vw,16px);white-space:nowrap}
.fp .emo,.fp .kana{font-size:clamp(18px,5vw,24px)}
.gobar{position:sticky}
.totrain{position:absolute;right:0;bottom:calc(100% - 6px);width:56px;height:56px;border:0;border-radius:50%;background:var(--card);box-shadow:0 4px 0 var(--line),0 6px 16px rgba(30,42,69,.14);display:grid;place-items:center;cursor:pointer;animation:tpop .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes tpop{from{transform:scale(.6)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){ .totrain{animation:none} }
.totrain .emo{font-size:30px;line-height:1}
.totrain:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}

/* ---------- 🎤 on every learn card (2026-10-13): record, hear yourself, then the model; a はなまる floats up ---------- */
/* on learn cards 🎤 (and 👂 after a take) sit in the bottom bar between ◀ and ▶, always in reach */
.dmic{display:flex;gap:10px;justify-content:center;align-items:center;flex:1}
.dmic .btn.round{width:62px;flex:none}
.fhana{position:fixed;z-index:30;pointer-events:none;color:var(--shu);transform:translate(-50%,-50%);animation:fhana 1.2s ease-out forwards}
@keyframes fhana{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}25%{opacity:1;transform:translate(-50%,-90%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
@media (prefers-reduced-motion:reduce){ .fhana{animation:none;opacity:1} }
.learn-card .ph{font-size:clamp(22px,6.4vw,40px)!important}
.prompt-text{word-break:keep-all;overflow-wrap:anywhere}
@media (max-height:600px){ .choice{height:clamp(84px,min(32vw,17vh),200px)} .talk-card .art.xl{width:min(100%,440px,26vh)} }
/* short screens: everything above the bottom bar, the 🎤 row and ? included */
@media (max-height:720px){
  .mean-row{margin-top:6px;min-height:0}
  .qbtn{width:42px;height:42px;font-size:21px}
}
@media (max-height:600px){
  .prompt-text{font-size:20px} .prompt{min-height:46px;gap:10px}
  .learn-card{min-height:0;padding:12px;gap:6px}
  .learn-card .emo.xl{font-size:clamp(64px,15vh,120px)}
  .talk-card{padding:12px;gap:8px} .talk-card .ph{font-size:20px!important}
  .rec-row .btn.round{width:54px;height:54px;min-height:0}
}
@media (max-height:720px){
  .learn-card .swatch.xl{width:clamp(70px,min(30vw,16vh),170px)}
  .learn-card .ph{font-size:clamp(20px,5.6vw,32px)!important}
}
@media (max-height:600px){
  .say-opt{font-size:16px;min-height:46px} .scene .art.xl{width:min(100%,420px,26vh)}
  .choice{height:clamp(76px,min(32vw,15vh),200px)} .read-word{font-size:clamp(30px,9vw,44px)} p.sub{margin:2px 0 6px}
  .talk-card .swatch.xl{width:clamp(60px,14vh,120px)}
}
/* learn cards: the grown-ups' ? sits at the end of the instruction line; the meaning opens under the card */
.prompt .qbtn{margin-left:auto}

/* ---------- daily review, picture stories (2026-10-13) ---------- */
.k-story{--kc:var(--shu);--kc-d:#A9301C}
.review-btn{position:absolute;left:0;bottom:calc(100% - 6px);height:56px;padding:0 18px 0 12px;border:0;border-radius:28px;background:var(--card);
  box-shadow:0 4px 0 color-mix(in srgb,var(--shu) 45%,var(--line)),0 6px 16px rgba(30,42,69,.14);display:flex;align-items:center;gap:6px;font-weight:900;
  font-size:18px;color:var(--ink);cursor:pointer;animation:tpop .3s cubic-bezier(.2,1.5,.4,1)}
.review-btn .emo{font-size:26px;line-height:1}
.review-btn:active{transform:translateY(3px)}
.story-page{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.4vh,12px);background:var(--card);border-radius:28px;border-top:10px solid var(--tc);
  box-shadow:0 6px 0 var(--line);padding:clamp(10px,2vh,18px)}
.story-pic{border:0;background:none;padding:0;cursor:pointer;width:100%;display:grid;place-items:center}
.story-page .art.xl{width:min(100%,460px,calc((100dvh - 430px) * 1.5))}
.nar{margin:0;color:var(--muted);font-weight:700;font-size:clamp(16px,4.4vw,21px);text-align:center;text-wrap:balance;word-break:keep-all}
.sline{display:flex;align-items:center;gap:10px}
.sline .ph{font-size:clamp(24px,6.6vw,40px)!important}
.set.sync .code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.06em;font-size:1.05em}
.set.sync input{width:9.5em;font:inherit;padding:6px 8px;border:2px solid var(--line);border-radius:10px;text-transform:uppercase}
/* iPad landscape (wide, short): match cards in 2 rows of 6; picture answers sized by the height */
@media (min-width:700px) and (max-height:900px){ .mgrid{grid-template-columns:repeat(6,minmax(0,1fr))} }
.choices.arts .art.l{width:min(100%,36vh)}
/* the meaning (behind ?) opens as a bubble in the card's top corner, so it never pushes the card or the buttons down */
#mean.mean-row{position:relative;height:0;min-height:0;margin:0;z-index:3}
#mean .meaning{position:absolute;right:12px;top:16px;max-width:calc(100% - 24px);box-shadow:0 3px 0 var(--line),0 6px 18px rgba(30,42,69,.16);animation:tpop .25s ease-out}

</style>
</head>

const RO = {あ:'a',い:'i',う:'u',え:'e',お:'o',か:'ka',き:'ki',く:'ku',け:'ke',こ:'ko',さ:'sa',し:'shi',す:'su',せ:'se',そ:'so',た:'ta',ち:'chi',つ:'tsu',て:'te',と:'to',な:'na',に:'ni',ぬ:'nu',ね:'ne',の:'no',は:'ha',ひ:'hi',ふ:'fu',へ:'he',ほ:'ho',ま:'ma',み:'mi',む:'mu',め:'me',も:'mo',や:'ya',ゆ:'yu',よ:'yo',ら:'ra',り:'ri',る:'ru',れ:'re',ろ:'ro',わ:'wa',を:'o',ん:'n',
  が:'ga',ぎ:'gi',ぐ:'gu',げ:'ge',ご:'go',ざ:'za',じ:'ji',ず:'zu',ぜ:'ze',ぞ:'zo',だ:'da',ぢ:'ji',づ:'zu',で:'de',ど:'do',ば:'ba',び:'bi',ぶ:'bu',べ:'be',ぼ:'bo',ぱ:'pa',ぴ:'pi',ぷ:'pu',ぺ:'pe',ぽ:'po',ぁ:'a',ぃ:'i',ぅ:'u',ぇ:'e',ぉ:'o'};
const YO = {ゃ:'a',ゅ:'u',ょ:'o'};
function romaji(str){
  const h = str.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  return h.split(/\s+/).map(tok => {
    let out = '', dbl = false;
    for(let i=0;i<tok.length;i++){
      const c = tok[i], n = tok[i+1];
      if(c === 'っ'){ dbl = true; continue; }
      if(c === 'ー'){ const v = out.match(/[aeiou](?=[^aeiou]*$)/); out += v ? v[0] : ''; continue; }
      let r = RO[c];
      if(r === undefined){ out += c; continue; }
      if(c === 'は' && i === tok.length-1 && tok.length > 1) r = 'wa';
      if(n && YO[n]){ r = r.replace(/i$/,''); if(!/^(sh|ch|j)$/.test(r)) r += 'y'; r += YO[n]; i++; }
      else if(n && (n === 'ぁ'||n === 'ぃ'||n === 'ぇ'||n === 'ぉ')){ r = r.replace(/[aiueo]$/,'') + RO[n]; i++; }
      if(c === 'ん' && n && /^[aiueoy]/.test(RO[n]||'')) r = "n'";
      if(dbl){ r = (r.startsWith('ch') ? 't' : r[0]) + r; dbl = false; }
      out += r;
    }
    return out;
  }).join(' ').replace(/、/g, ', ').replace(/！/g,'!').replace(/？/g,'?');
}

const stopName = id => isRow(id) ? rowChars(id).join('') : topicOf(id).name;
const stopIcon = id => isRow(id) ? `<span class="kana">${rowChars(id)[0]}</span>` : `<span class="emo">${topicOf(id).icon}</span>`;
const stopKind = id => isRow(id) ? 'write' : ({phrase:'talk', sound:'sound', story:'story'})[topicOf(id).kind] || 'words';
function openStop(id){ sfx.tap(); if(isRow(id)) startRow(id); else go('lesson', id); }
let ARRIVE = null;
const XS = [50, 77, 50, 23];   // stops zig-zag across the board (percent of the width)

function home(){
  view.style.removeProperty('--tc');
  const nx = nextStop(), here = nx < 0 ? STOPS.length - 1 : nx;
  let y = 96, stops = '', bands = '', pts = [], pos = [];
  JOURNEY.forEach(g => {
    const top = y; y += 146;
    g.stops.forEach(id => {
      const i = STOPS.findIndex(x => x.id === id), x = XS[i % 4], done = stopDone(id), st = done ? 'done' : i === nx ? 'now' : 'lock';
      const n = done ? (S.stars[id] || 3) : 0;
      pts.push([x, y]); pos.push([x, y]);
      stops += `<button class="stop ${st} k-${stopKind(id)}" style="left:${x}%;top:${y}px" data-stop="${id}" aria-label="${i+1}. ${stopName(id)}">
        <span class="disc">${stopIcon(id)}</span><span class="snum">${i+1}</span>
        ${done ? `<span class="sstars">${[1,2,3].map(k => `<i class="${k <= n ? 'on' : ''}">${hanamaru(17)}</i>`).join('')}</span>` : `<span class="sname kana">${stopName(id)}</span>`}</button>`;
      y += 108;
    });
    const deco = (g.deco || []).map((e, k) => `<span class="jdeco" style="left:${k % 2 ? 91 : 9}%;top:${top + 70 + k * Math.max(60, (y - top - 140) / Math.max(1, g.deco.length - 1))}px">${e}</span>`).join('');
    bands += `<div class="jband" style="top:${top}px;height:${y - top - 30}px;--bg:${g.bg}"><span class="jregion"><span class="emo">${g.icon}</span><span>${g.name}</span>${g.stops.every(stopDone) ? hanamaru(22) : ''}</span></div>${deco}`;
    y += 10;
  });
  const H = y + 70, cut = nx < 0 ? pts.length : nx + 1;
  const curve = list => list.slice(1).map((p, i) => { const q = list[i], my = (q[1] + p[1]) / 2; return `C${q[0]} ${my} ${p[0]} ${my} ${p[0]} ${p[1]}`; }).join('');
  const line = list => `M50 40 L${pts[0][0]} ${pts[0][1]}` + curve(list);
  const [tx, ty] = pos[ARRIVE ? ARRIVE.from : here];
  const nxt = nx < 0 ? null : STOPS[nx].id;
  h(`<div class="free" role="navigation" aria-label="あそぶ">
      <button class="fp fp-words" data-go="themes"><span class="emo">🐶</span>ことば</button>
      <button class="fp fp-talk" data-go="phrases"><span class="emo">🙏</span>おはなし</button>
      <button class="fp fp-write" data-go="kana"><span class="kana">あ</span>かく</button>
      <button class="fp fp-stick" data-go="stickers"><span class="emo">🎁</span>シール</button></div>
    <div class="journey" id="journey" style="height:${H}px">
      ${bands}
      <svg class="jtrack" viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true">
        <path class="bed" d="${line(pts)}"/><path class="ties" d="${line(pts)}"/><path class="got" d="${line(pts.slice(0, cut))}"/></svg>
      <div class="jstart"><span class="emo">🚉</span><span>しゅっぱつ</span></div>
      ${stops}
      <div class="jgoal" style="top:${H - 64}px"><span class="emo">🎌</span><span>ゴール</span></div>
      <span class="train" id="train" style="left:${tx}%;top:${ty}px" aria-hidden="true">🚃</span>
    </div>
    <div class="gobar">${reviewDue() ? `<button class="review-btn" id="review" aria-label="ふくしゅう"><span class="emo">🔁</span><span class="kana">ふくしゅう</span></button>` : ''}<button class="totrain" id="toTrain" aria-label="でんしゃに もどる" hidden><span class="emo">🚃</span></button><button class="btn primary go-next" id="goNext">${nxt ? `${stopIcon(nxt)}<span>つぎ</span>` : `<span class="emo">🎉</span><span>ゴール！</span>`}</button></div>`);
  bindGo();
  view.querySelectorAll('.stop').forEach(b => b.onclick = () => {
    if(b.classList.contains('lock')){ sfx.no(); shake(b); return; }
    openStop(b.dataset.stop); });
  $('#goNext').onclick = () => nxt ? openStop(nxt) : (sfx.tap(), go('stickers'));
  if($('#review')) $('#review').onclick = () => { sfx.tap(); go('lesson', 'review'); };
  const centre = (i, smooth) => { const el = view.querySelector(`[data-stop="${STOPS[i].id}"]`); if(!el) return;
    const d = el.getBoundingClientRect().top - view.getBoundingClientRect().top - view.clientHeight * .42;
    view.scrollTo({top: view.scrollTop + d, behavior: smooth && !reduce ? 'smooth' : 'auto'}); };
  centre(ARRIVE ? ARRIVE.from : here);
  /* 🚃 back to the train: shown only while the train's stop is scrolled out of sight */
  const tt = $('#toTrain'), mine = view.querySelector(`[data-stop="${STOPS[here].id}"]`);
  tt.onclick = () => { sfx.tap(); centre(here, true); };
  const seen = () => { if(!mine || !mine.isConnected){ view.removeEventListener('scroll', seen); return; }
    const r = mine.getBoundingClientRect(), v = view.getBoundingClientRect();
    tt.hidden = r.bottom > v.top + 70 && r.top < v.bottom - 110; };
  view.addEventListener('scroll', seen, {passive:true});
  if(!ARRIVE) return;
  const from = ARRIVE.from; ARRIVE = null;
  const tr = $('#train'), now = view.querySelector('.stop.now');
  if(now) now.classList.add('waiting');
  setTimeout(() => {
    if(!tr.isConnected) return;
    const [x2, y2] = pos[here]; tr.style.left = x2 + '%'; tr.style.top = y2 + 'px'; tr.classList.add('ride'); centre(here, true);
    setTimeout(() => {
      if(!tr.isConnected) return; tr.classList.remove('ride');
      if(now){ now.classList.remove('waiting'); now.classList.add('arrive'); }
      if(nx < 0){ sfx.win(); say('ゴール！ おめでとう ございます！'); confetti(); return; }
      if(STOPS[nx].gi !== STOPS[from].gi){ const g = JOURNEY[STOPS[nx].gi];
        sfx.win(); toast(`<span class="emo">${g.icon}</span><span>${g.name}に つきました！</span>`); say(g.name + 'に つきました！'); confetti(); setTimeout(checkStickers, 3100); }
      else sfx.ok();
    }, reduce ? 0 : 1400);
  }, reduce ? 0 : 650);
}

function themes(kind){
  const list = kind === 'phrase' ? [...PHRASES, ...STORIES, ...(famReady() ? [famTopic()] : [])] : [...THEMES, ...SOUNDS];
  h(`<h1 class="screen-title">${kind === 'phrase' ? 'おはなし' : 'ことば'}</h1><div class="theme-grid">${list.map(t => `
    <button class="theme-card" data-go="lesson" data-arg="${t.id}" aria-label="${t.name}" style="--tc:var(${t.hue})">
      <span class="emo m">${t.icon}</span><span class="theme-name">${t.name}</span>${t.kata ? '<span class="kata-badge kana">カタカナ</span>' : ''}
      <span class="meter" aria-hidden="true">${t.words.map(w => `<i class="${mastered(w.k)?'on':''}"></i>`).join('')}</span>
      ${(S.themes[t.id]||0) > 0 ? `<span class="done-mark">${hanamaru(34)}</span>` : ''}
    </button>`).join('')}</div>`);
  bindGo(); say('どれに しますか？');
}

function lesson(id){
  const t = id === 'family' ? famTopic() : id === 'review' ? reviewTopic() : ALL.find(x => x.id === id);
  if(!t || t.words.length < (t.kind === 'phrase' || t.kind === 'review' ? 4 : 2)){ go(prevScreen === 'lesson' ? 'home' : prevScreen || 'home'); return; }
  const steps = t.kind === 'review' || t.kind === 'story' ? [] : [{type:'learn'}];
  if(t.kind === 'review') t.words.forEach((w, i) => { const k = topicOf(w.t).kind; steps.push({type:k === 'sound' ? 'spell' : k === 'phrase' || !(i % 2) ? 'listen' : 'read', w}); });
  else if(t.kind === 'story') t.words.forEach(w => steps.push({type:'story', w}));
  else if(t.kind === 'phrase'){
    pickTargets(t.words, 4).forEach(w => steps.push({type:'say', w}));
    pickTargets(t.words, 3).forEach(w => steps.push({type:'listen', w}));
    pickTargets(t.words, 2).forEach(w => steps.push({type:'read', w}));
    steps.push({type:'talk'});
  } else if(t.kind === 'sound'){
    pickTargets(t.words, 5).forEach(w => steps.push({type:'spell', w}));
    pickTargets(t.words, 3).forEach(w => steps.push({type:'beats', w}));
  } else {
    pickTargets(t.words, 5).forEach(w => steps.push({type:'listen', w}));
    pickTargets(t.words, 4).forEach(w => steps.push({type:'read', w}));
    steps.push({type:'match'}, {type:'talk'});
  }
  view.style.setProperty('--tc', `var(${t.hue})`);
  L = {t, steps, i:0, earned:0, ok:0, n:0, recd:new Set(), intro:t.kind === 'review' ? 'ふくしゅう しましょう！' : null, from:prevScreen === 'lesson' && L ? L.from : prevScreen, was:stopDone(id)};
  markDay(); step();
}
const stepsBar = () => { const pct = Math.round(L.i / L.steps.length * 100);
  return speedBar() + `<div class="rail" role="progressbar" aria-valuemin="1" aria-valuemax="${L.steps.length}" aria-valuenow="${L.i+1}"><span class="rail-track"><i style="width:${pct}%"></i></span><span class="rail-train" style="left:${pct}%" aria-hidden="true">🚃</span><span class="rail-flag" aria-hidden="true">🏁</span></div>`; };
const speedBar = () => `<div class="speedbar"><span class="emo" aria-hidden="true">🐢</span><input type="range" class="spd" min="0" max="2" step="1" value="${S.settings.speed}" aria-label="こえの はやさ (ゆっくり … はやい)"><span class="emo" aria-hidden="true">🐇</span></div>`;
const tally = ok => { if(!L) return; L.n++; if(ok) L.ok++; };
const starsFor = (ok, n) => !n ? 3 : ok/n >= .85 ? 3 : ok/n >= .5 ? 2 : 1;
function next(){ if(current !== 'lesson') return; L.i++; if(L.i >= L.steps.length) finish(); else step(); }
function step(){ const s = L.steps[L.i]; ({learn:stLearn, listen:stListen, read:stRead, match:stMatch, talk:stTalk, say:stSay, spell:stSpell, beats:stBeats, story:stStory})[s.type](s); }
/* picture story page: the coach reads the page, the voice says the line, then the child says it too (🎤) */
function stStory(s){ const w = s.w, last = L.i === L.steps.length - 1;
  h(`${stepsBar()}<div class="story-page"><button class="story-pic" id="spic" aria-label="${w.k}">${pic(w,'xl')}</button><p class="nar kana">${w.nar}</p>
      <div class="sline">${spk('sp','small')}<span class="kana word ph">${w.k}</span></div></div>
    <div class="nav-row dock"><button class="btn" id="pv" aria-label="まえ" ${L.i === 0 ? 'disabled' : ''}>◀</button>${canRecord() ? `<span class="dmic">${micBtns()}</span>` : `<span class="count">${L.i+1} / ${L.steps.length}</span>`}<button class="btn primary" id="nx" aria-label="つぎ">${last ? 'つぎへ ▶' : '▶'}</button></div>`);
  say(L.i === 0 && canRecord() ? [w.nar, w.k, 'じぶんで いって みましょう'] : [w.nar, w.k]);
  $('#sp').onclick = () => say(w.k);
  $('#spic').onclick = () => { say([w.nar, w.k]); bump($('#spic')); };
  if(canRecord()) bindRecorder($('#mic'), $('#me'), recFor(w, $('#mic')));
  $('#pv').onclick = () => { stopRecorder(); if(L.i > 0){ L.i--; step(); } };
  $('#nx').onclick = () => { stopRecorder(); next(); };
}
const isS = () => L.t.kind === 'sound';
/* ー, っ/ッ and long vowels (おかあさん, ひこうき) shown in red: the sounds that take a full beat */
const VOW = c => { const h = c.replace(/[ァ-ヶ]/g, x => String.fromCharCode(x.charCodeAt(0) - 0x60)), r = {ゃ:'a', ゅ:'u', ょ:'o'}[h] || RO[h] || RO[h.slice(-1)]; return r ? r.slice(-1) : ''; };
function markWord(w){ const cs = [...w];
  return cs.map((c, i) => { const p = cs[i-1] && VOW(cs[i-1]), long = /[ーっッ]/.test(c) || (p && ({あ:'a', い:'ie', う:'uo', え:'e', お:'o'}[c] || '').includes(p) && !/[ゃゅょ]/.test(c));
    return long ? `<b class="mk">${c}</b>` : c; }).join(''); }
const beatRow = w => `<span class="beats" aria-label="${beats(w).length}">${beats(w).map(b => `<span class="beat"><span class="kana">${markWord(b)}</span><i></i></span>`).join('')}</span>`;

/* sound game 1: hear the word, pick the right spelling */
function stSpell(s){
  const w = s.w, opts = shuffle([w.k, ...w.alt]); let first = true, locked = false;
  h(`${stepsBar()}<div class="prompt">${spk('sp')}<span class="prompt-text">ただしい ほうは どれですか？</span></div>
    <div class="scene">${pic(w,'xl')}</div>
    <div class="spell-opts">${opts.map((o,i) => `<button class="spell-opt kana" data-i="${i}">${o}</button>`).join('')}</div>`);
  ask(qSpell(w.k), ['ただしい ほうは どれですか？', w.k]);
  $('#sp').onclick = () => say(w.k);
  view.querySelectorAll('.spell-opt').forEach(b => b.onclick = () => {
    if(locked) return; const o = opts[+b.dataset.i];
    if(o === w.k){ locked = true; b.classList.add('right'); b.innerHTML = markWord(o); sfx.ok(); say(w.k); if(first){ rec(w.k, true); tally(true); addHana(1); } setTimeout(next, 1400); }
    else { b.classList.add('wrong'); b.disabled = true; sfx.no(); shake(b); say(w.k); if(first){ first = false; rec(w.k, false); tally(false); } }
  });
}
/* sound game 2: count the beats (claps) */
function stBeats(s){
  const w = s.w, n = beats(w.k).length, choices = [...new Set([n-1, n, n+1].filter(x => x >= 1))]; let first = true, locked = false;
  h(`${stepsBar()}<div class="prompt">${spk('sp')}<span class="prompt-text">いくつ たたきますか？</span></div>
    <div class="scene">${pic(w,'xl')}<span class="kana word bword" id="bword">${w.k}</span></div>
    <div class="beat-opts">${choices.map(c => `<button class="beat-opt" data-n="${c}" aria-label="${c}"><span class="claps">${'👏'.repeat(c)}</span><b>${c}</b></button>`).join('')}</div>`);
  ask(qBeats(w.k), ['いくつ たたきますか？', w.k]);
  $('#sp').onclick = () => say(w.k);
  view.querySelectorAll('.beat-opt').forEach(b => b.onclick = () => {
    if(locked) return; const c = +b.dataset.n;
    if(c === n){ locked = true; b.classList.add('right'); sfx.ok(); $('#bword').outerHTML = beatRow(w.k);
      say(w.k); if(first){ rec(w.k, true); tally(true); addHana(1); } setTimeout(next, 2200); }
    else { b.classList.add('wrong'); b.disabled = true; sfx.no(); shake(b); say(w.k); if(first){ first = false; rec(w.k, false); tally(false); } }
  });
}
const isP = () => L.t.kind === 'phrase';
/* phrase answers: pictures in a 2×2 grid; family phrases (emoji) in one column */
const chCls = opts => opts.every(hasArt) ? ' arts' : isP() ? ' wide' : '';
/* the meaning behind ?: English, or Khmer when a grown-up chooses it (KM is a draft until Nick has checked it) */
const meaning = w => S.settings.hint === 'km' && KM[w.k] ? `<span class="km" lang="km">${KM[w.k]}</span>` : w.en;

/* phrase game: see the scene, pick what you say */
function stSay(s){
  const w = s.w, opts = shuffle([w, ...shuffle(L.t.words.filter(x => x.k !== w.k)).slice(0,2)]); let first = true, locked = false;
  h(`${stepsBar()}<div class="prompt"><span class="prompt-text">なんと いいますか？</span></div>
    <div class="scene">${pic(w,'xl')}</div>
    <div class="say-opts">${opts.map((o,i) => `<div class="say-row"><button class="spk hint small" data-hear="${i}" aria-label="きく">${SPK}</button><button class="say-opt kana" data-i="${i}">${o.k}</button></div>`).join('')}</div>`);
  say('なんと いいますか？');
  view.querySelectorAll('[data-hear]').forEach(b => b.onclick = () => say(opts[+b.dataset.hear].k));
  view.querySelectorAll('.say-opt').forEach(b => b.onclick = () => {
    if(locked) return; const o = opts[+b.dataset.i];
    if(o.k === w.k){ locked = true; b.classList.add('right'); sfx.ok(); say(w.k); if(first){ rec(w.k, true); tally(true); addHana(1); } setTimeout(next, 1500); }
    else { b.classList.add('wrong'); b.disabled = true; sfx.no(); shake(b); if(first){ first = false; rec(w.k, false); tally(false); } }
  });
}

function stLearn(){
  const W = L.t.words; let j = 0;
  const draw = (intro) => { const w = W[j];
    h(`${stepsBar()}<div class="prompt">${spk('sp')}<span class="prompt-text">さわって きいて ください</span><button class="qbtn" id="qm" aria-label="Show meaning" aria-expanded="false">?</button></div>
      <div class="mean-row" id="mean" hidden><span class="meaning">${meaning(w)}</span></div>
      <button class="learn-card" id="lc" aria-label="${w.k}">${pic(w,'xl')}${isS() ? beatRow(w.k) : S.settings.kana || isP() ? `<span class="kana word${isP()?' ph':''}">${w.k}</span>` : ''}</button>
      <div class="nav-row dock"><button class="btn" id="pv" aria-label="まえ" ${j===0?'disabled':''}>◀</button>${canRecord() ? `<span class="dmic">${micBtns()}</span>` : `<span class="count">${j+1} / ${W.length}</span>`}<button class="btn primary" id="nx" aria-label="つぎ">${j===W.length-1?'つぎへ ▶':'▶'}</button></div>`);
    say(intro ? [isS() ? 'てを たたいて かぞえましょう' : 'さわって きいて ください', w.k] : w.k);
    $('#lc').onclick = () => { say(w.k); bump($('#lc')); };
    $('#sp').onclick = () => say(w.k);
    $('#qm').onclick = () => { const m = $('#mean'); m.hidden = !m.hidden; $('#qm').setAttribute('aria-expanded', String(!m.hidden)); sfx.tap(); };
    $('#mean').onclick = () => $('#qm').click();   // tap the bubble to close it
    if(canRecord()) bindRecorder($('#mic'), $('#me'), recFor(w, $('#mic')));
    $('#pv').onclick = () => { stopRecorder(); if(j > 0){ j--; draw(); } };
    $('#nx').onclick = () => { stopRecorder(); if(j < W.length-1){ j++; draw(); } else next(); };
  };
  draw(true);
}

function stListen(s){
  const w = s.w, opts = options(w); let first = true, locked = false;
  h(`${stepsBar()}<div class="prompt">${spk('sp')}<span class="prompt-text">どれですか？</span></div>
    <div class="choices${chCls(opts)}">${opts.map((o,i) => `<button class="choice" data-i="${i}" aria-label="${o.k}">${pic(o,'l')}</button>`).join('')}</div>`);
  ask(qWhich(w.k), ['どれですか？', w.k]);
  $('#sp').onclick = () => say(w.k);
  view.querySelectorAll('.choice').forEach(b => b.onclick = () => {
    if(locked) return; const o = opts[+b.dataset.i];
    if(o.k === w.k){ locked = true; b.classList.add('right'); sfx.ok(); say(w.k); if(first){ rec(w.k, true); tally(true); addHana(1); } setTimeout(next, 1100); }
    else { b.classList.add('wrong'); b.disabled = true; sfx.no(); shake(b); say(o.k); if(first){ first = false; rec(w.k, false); tally(false); } }
  });
}

function stRead(s){
  const w = s.w, opts = options(w); let first = true, hinted = false, locked = false;
  h(`${stepsBar()}<div class="prompt">${spk('sp','hint')}<span class="kana read-word${isP()?' ph':''}">${w.k}</span></div>
    <p class="sub">よんで えらんで ください</p>
    <div class="choices${chCls(opts)}">${opts.map((o,i) => `<button class="choice" data-i="${i}" aria-label="${o.k}">${pic(o,'l')}</button>`).join('')}</div>`);
  say('よんで えらんで ください');
  $('#sp').onclick = () => { hinted = true; say(w.k); };
  view.querySelectorAll('.choice').forEach(b => b.onclick = () => {
    if(locked) return; const o = opts[+b.dataset.i];
    if(o.k === w.k){ locked = true; b.classList.add('right'); sfx.ok(); say(w.k); if(first){ rec(w.k, !hinted); tally(!hinted); if(!hinted) addHana(1); } setTimeout(next, 1100); }
    else { b.classList.add('wrong'); b.disabled = true; sfx.no(); shake(b); say(o.k); if(first){ first = false; rec(w.k, false); tally(false); } }
  });
}

function stMatch(){
  const ws = shuffle(L.t.words).slice(0,6);
  const cards = shuffle([...ws.map(w => ({w, kind:'p'})), ...ws.map(w => ({w, kind:'k'}))]);
  let open = [], matched = 0, busy = false;
  h(`${stepsBar()}<div class="prompt"><span class="prompt-text">おなじ ものを みつけましょう</span></div>
    <div class="mgrid">${cards.map((c,i) => `<button class="mcard" data-i="${i}" aria-label="カード ${i+1}"><span class="back">${hanamaru(46)}</span><span class="face">${c.kind==='p' ? pic(c.w,'s') : `<span class="kana mword">${c.w.k}</span>`}</span></button>`).join('')}</div>`);
  say('おなじ ものを みつけましょう');
  const els = [...view.querySelectorAll('.mcard')];
  els.forEach((el,i) => el.onclick = () => {
    if(busy || el.classList.contains('up')) return;
    el.classList.add('up'); say(cards[i].w.k); open.push(i);
    if(open.length === 2){
      const [a,b] = open; open = [];
      if(cards[a].w.k === cards[b].w.k){ els[a].classList.add('got'); els[b].classList.add('got'); sfx.ok(); matched++;
        if(matched === ws.length){ addHana(2); setTimeout(next, 1200); } }
      else { busy = true; setTimeout(() => { els[a].classList.remove('up'); els[b].classList.remove('up'); busy = false; }, 1000); }
    }
  });
}

function stTalk(){
  const ws = shuffle(L.t.words).slice(0,3); let j = 0;
  if(isP()){
    const drawP = () => { if(j >= ws.length) return next(); const w = ws[j];

/* ---------- writing a kana: watch, then write stroke by stroke ----------
   The correct strokes come from KanjiVG (STROKE_D, viewBox 0 0 109 109). First time: the strokes animate in order,
   numbered, while the coach says "かきじゅんを みましょう". Then the child writes one stroke at a time: a green start
   dot and arrow show the next stroke. Each stroke is compared with the expected one (shape, start, direction, order):
   right → it snaps into clean ink; drawn backwards → "むきが ちがいます"; a later stroke first → "じゅんばんが
   ちがいます"; otherwise "もう いちど かきましょう". After a mistake the correct stroke replays. Under the box:
   2-3 example words with the kana highlighted (tap to hear). */
const KV = 109, PAD = 4;                         // KanjiVG units; the masu box adds a margin so its border is never cut
const NPTS = 24, OK_DIST = .16;                  // points compared per stroke; accepted mean distance (share of the box)
function resample(pts, n = NPTS){
  if(pts.length < 2) return Array(n).fill(pts[0] || [0, 0]);
  const L = [0]; for(let i = 1; i < pts.length; i++) L.push(L[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
  const tot = L[L.length-1] || 1, out = []; let j = 0;
  for(let i = 0; i < n; i++){ const t = tot * i / (n-1); while(j < L.length-2 && L[j+1] < t) j++;
    const seg = (L[j+1] - L[j]) || 1, f = Math.min(1, Math.max(0, (t - L[j]) / seg));
    out.push([pts[j][0] + (pts[j+1][0]-pts[j][0])*f, pts[j][1] + (pts[j+1][1]-pts[j][1])*f]); }
  return out; }
const meanDist = (a, b) => a.reduce((s, p, i) => s + Math.hypot(p[0]-b[i][0], p[1]-b[i][1]), 0) / a.length;
const kwHTML = (w, k) => esc(w).split(k).join(`<b>${k}</b>`);
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function trace(k){
  markDay();
  if(RS && RS.chars[RS.j] !== k) RS = null;
  const LIST = KATA.includes(k) ? KATA : KANA; script = LIST === KATA ? 'kata' : 'hira';
  const idx = LIST.indexOf(k), D = STROKE_D[k] || [], n = D.length || STROKES[k] || 1, words = KANA_WORDS[k] || [];
  const firstTime = !S.kana[k];
  h(`${RS ? `<div class="row-dots" aria-label="${RS.j+1} / ${RS.chars.length}">${RS.chars.map((c,i) => `<span class="kana${i < RS.j ? ' done' : i === RS.j ? ' now' : ''}">${c}</span>`).join('')}</div>` : ''}
    <div class="trace-top"><button class="icon-btn" id="tp" aria-label="まえ" ${idx===0||RS?'disabled':''}>◀</button><span class="prompt-text">なぞって かきましょう</span><button class="icon-btn" id="tn" aria-label="つぎ" ${idx===LIST.length-1||RS?'disabled':''}>▶</button></div>
    <div class="masu-wrap" id="mw">
      <svg class="masu" id="msvg" viewBox="${-PAD} ${-PAD} ${KV+2*PAD} ${KV+2*PAD}" role="img" aria-label="${k}">
        <rect class="mbox" x="${-PAD/2}" y="${-PAD/2}" width="${KV+PAD}" height="${KV+PAD}" rx="7"/>
        <path class="mguide" d="M${KV/2} ${-PAD/2}V${KV+PAD/2}M${-PAD/2} ${KV/2}H${KV+PAD/2}"/>
        <g id="gfaint">${D.map(d => `<path class="sg" d="${d}"/>`).join('')}</g>
        <g id="gink"></g><g id="gflash"></g><g id="ghint"></g></svg>
      <canvas id="masu" aria-hidden="true"></canvas>
      <div class="tstamp" id="tstamp" hidden>${hanko()}</div></div>
    <div class="stroke-row" id="srow"><span class="kana">${n}</span><span>かいで かきましょう</span><span class="sdots" id="sdots">${'<i></i>'.repeat(n)}</span></div>
    ${words.length ? `<div class="kwords">${words.map(([w,e]) => `<button class="kw" data-w="${esc(w)}"><span class="emo">${e}</span><span class="kana">${kwHTML(w, k)}</span></button>`).join('')}</div>` : ''}
    ${PAIR[k] ? `<p class="pair">ひらがな <button class="pair-chip kana" id="pairBtn">${PAIR[k]}</button> と おなじ おとです</p>` : ''}
    <div class="nav-row tnav dock"><button class="btn round" id="tsay" aria-label="きく">${SPK}</button><button class="btn" id="twatch" aria-label="かきじゅんを みる">▶ かきじゅん</button><button class="btn" id="tclear">けします</button><button class="btn primary" id="tnext" hidden>つぎ ▶</button></div>`);
  $('#tp').onclick = () => go('trace', LIST[idx-1]);
  $('#tn').onclick = () => go('trace', LIST[idx+1]);
  if(PAIR[k]) $('#pairBtn').onclick = () => say(PAIR[k]);
  view.querySelectorAll('.kw').forEach(b => b.onclick = () => { say(b.dataset.w); bump(b); });
  $('#tsay').onclick = () => say(k);

  const svg = $('#msvg'), faint = [...svg.querySelectorAll('#gfaint path')], ink = $('#gink'), flash = $('#gflash'), hint = $('#ghint');
  // the expected strokes as point lists (0..1 of the KanjiVG box)
  const EXP = faint.map(p => { const L = p.getTotalLength(), pts = [];
    for(let i = 0; i < NPTS; i++){ const q = p.getPointAtLength(L * i / (NPTS-1)); pts.push([q.x / KV, q.y / KV]); } return pts; });
  let cur = 0, fails = 0, failsHere = 0, busy = false, done = false;

  const showHint = () => { if(done || !EXP[cur]){ hint.innerHTML = ''; return; }
    const a = EXP[cur][0], b = EXP[cur][Math.min(5, NPTS-1)], ang = Math.atan2(b[1]-a[1], b[0]-a[0]);
    const x = a[0]*KV, y = a[1]*KV, ax = x + Math.cos(ang)*13, ay = y + Math.sin(ang)*13;
    hint.innerHTML = `<path class="harrow" d="M${x} ${y}L${ax} ${ay}"/><path class="harrowh" d="M${ax} ${ay}l${Math.cos(ang+2.5)*5} ${Math.sin(ang+2.5)*5}M${ax} ${ay}l${Math.cos(ang-2.5)*5} ${Math.sin(ang-2.5)*5}"/>
      <circle class="hdot" cx="${x}" cy="${y}" r="5.5"/><text class="hnum" x="${x}" y="${y+2.6}">${cur+1}</text>`; };
  const dots = () => [...$('#sdots').children].forEach((el, i) => el.classList.toggle('on', i < cur));
  const drawStroke = (layer, i, cls, ms) => new Promise(res => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', D[i]); p.setAttribute('class', cls); layer.appendChild(p);
    const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = reduce ? 0 : L;
    if(reduce || !ms) { p.style.strokeDashoffset = 0; return res(p); }
    const an = p.animate([{strokeDashoffset:L},{strokeDashoffset:0}], {duration:ms, easing:'ease-in-out', fill:'forwards'}); an.onfinish = () => res(p); });
  const watch = async () => { if(busy) return; busy = true; hint.innerHTML = ''; flash.innerHTML = '';
    for(let i = 0; i < D.length; i++){ if(!svg.isConnected) return;
      const p = await drawStroke(flash, i, 'sanim', 520 + i*0);
      const s0 = EXP[i][0]; flash.insertAdjacentHTML('beforeend', `<circle class="anum-bg" cx="${s0[0]*KV}" cy="${s0[1]*KV}" r="5"/><text class="anum" x="${s0[0]*KV}" y="${s0[1]*KV+2.4}">${i+1}</text>`);
      await new Promise(r => setTimeout(r, 160)); }
    await new Promise(r => setTimeout(r, 650)); if(!svg.isConnected) return;
    flash.innerHTML = ''; busy = false; showHint(); };
  const replayOne = async i => { flash.innerHTML = ''; await drawStroke(flash, i, 'sflash', 600); setTimeout(() => { if(flash.isConnected) flash.innerHTML = ''; }, 700); };

  // drawing on the overlay canvas
  const cv = $('#masu'), wrap = $('#mw'), size = Math.floor(wrap.getBoundingClientRect().width), dpr = devicePixelRatio || 1;
  cv.width = size*dpr; cv.height = size*dpr; cv.style.width = cv.style.height = size + 'px';
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  const unit = size / (KV + 2*PAD);                                   // pixels per KanjiVG unit
  const toK = e => { const r = cv.getBoundingClientRect(); return [((e.clientX-r.left)/r.width*(KV+2*PAD) - PAD) / KV, ((e.clientY-r.top)/r.height*(KV+2*PAD) - PAD) / KV]; };
  let line = null;
  const paintLine = () => { ctx.clearRect(0,0,size,size); if(!line || line.length < 1) return;
    ctx.strokeStyle = '#1E2A45'; ctx.lineWidth = 6.5*unit; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); line.forEach((p, i) => { const x = (p[0]*KV + PAD)*unit, y = (p[1]*KV + PAD)*unit; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke(); };
  cv.onpointerdown = e => { if(done || busy) return; e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(_){} line = [toK(e)]; paintLine(); };
  cv.onpointermove = e => { if(!line) return; line.push(toK(e)); paintLine(); };
  cv.onpointerup = cv.onpointercancel = () => { if(!line) return; const pts = line; line = null; judge(pts); };

  const judge = pts => {
    const len = pts.reduce((s, p, i) => i ? s + Math.hypot(p[0]-pts[i-1][0], p[1]-pts[i-1][1]) : 0, 0);
    if(len < .03){ ctx.clearRect(0,0,size,size); return; }            // a tap, not a stroke
    const u = resample(pts), dF = j => meanDist(u, EXP[j]), dR = j => meanDist(u, [...EXP[j]].reverse());
    const here = dF(cur);
    ctx.clearRect(0,0,size,size);
    if(here <= OK_DIST){
      drawStroke(ink, cur, 'sink', 160); cur++; failsHere = 0; dots(); sfx.tap();
      if(cur >= D.length) return finished();
      showHint(); return; }
    fails++; failsHere++; if(RS) RS.fails++;
    let msg = 'もう いちど かきましょう';
    if(dR(cur) <= OK_DIST) msg = 'むきが ちがいます';
    else if(EXP.some((_, j) => j > cur && dF(j) <= OK_DIST)) msg = 'じゅんばんが ちがいます';
    sfx.no(); shake(wrap); say(msg); replayOne(cur);
  };
  const finished = () => {
    done = true; hint.innerHTML = '';
    const first = !S.kana[k]; S.kana[k] = (S.kana[k]||0) + 1; save();
    $('#tstamp').hidden = false; sfx.win(); say('よく できました！'); confetti(); addHana(first ? 2 : 1); if(RS) RS.earned += first ? 2 : 1;
    const b = $('#tnext'); b.hidden = false; $('#tclear').hidden = true;
    if(RS){ const last = RS.j >= RS.chars.length-1; b.textContent = last ? 'できました！' : 'つぎ ▶';
      b.onclick = () => { if(last) return finishRow(); RS.j++; go('trace', RS.chars[RS.j]); }; }
    else { b.textContent = idx < LIST.length-1 ? 'つぎ ▶' : 'おわり';
      b.onclick = () => idx < LIST.length-1 ? go('trace', LIST[idx+1]) : go('kana'); }
  };
  $('#tclear').onclick = () => { ink.innerHTML = ''; flash.innerHTML = ''; cur = 0; failsHere = 0; done = false; ctx.clearRect(0,0,size,size); dots(); showHint(); };
  $('#twatch').onclick = () => { say('かきじゅんを みましょう'); ink.innerHTML = ''; cur = 0; dots(); watch(); };

  if(firstTime && D.length){ say(!RS || RS.j === 0 ? ['かきじゅんを みましょう', k] : [k]); setTimeout(() => { if(svg.isConnected) watch(); }, reduce ? 0 : 900); }
  else { say(!RS || RS.j === 0 ? ['なぞって かきましょう', k] : k); showHint(); }
}

/* ---------- our family's voice ----------
   Grown-ups can record any phrase or word in their own voice, and add their family's own phrases. A take is trimmed
   to the speech (with a little air), evened out to the app's loudness, saved as a small WAV on this device
   (IndexedDB "kidlingo", store "voices", key = the Japanese text) and played instead of the app voice while
   "Use our recordings" is on. Recordings travel in the progress file. Family phrases with a recording form the
   うちの ことば lesson (in おはなし) once there are 4. */
const FAM = {};                                          // text -> blob URL of the family's recording
const famOn = () => S.settings.family !== false;
const VDB = { db:null,
  open(){ return this.db || (this.db = new Promise((res, rej) => { const r = indexedDB.open('kidlingo', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('voices'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); })); },
  async run(mode, fn){ const db = await this.open(); return new Promise(res => { const q = fn(db.transaction('voices', mode).objectStore('voices')); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); },
  get(k){ return this.run('readonly', st => st.get(k)); }, set(k, v){ return this.run('readwrite', st => st.put(v, k)); },
  del(k){ return this.run('readwrite', st => st.delete(k)); }, keys(){ return this.run('readonly', st => st.getAllKeys()); } };
async function loadFamily(){ try{ for(const k of (await VDB.keys()) || []){ const b = await VDB.get(k); if(b){ if(FAM[k]) URL.revokeObjectURL(FAM[k]); FAM[k] = URL.createObjectURL(b); } } }catch(e){} }
async function tidyTake(blob){
  const AC = window.AudioContext || window.webkitAudioContext, c = new AC();
  try{
    const raw = await blob.arrayBuffer(), buf = await new Promise((res, rej) => c.decodeAudioData(raw, res, rej));
    const sr = buf.sampleRate, x = buf.getChannelData(0), fr = Math.max(1, Math.round(sr * .02)), n = Math.floor(x.length / fr), rms = [];
    for(let f = 0; f < n; f++){ let q = 0; for(let i = f*fr; i < (f+1)*fr; i++) q += x[i]*x[i]; rms.push(Math.sqrt(q / fr)); }
    let top = 0; for(const v of rms) if(v > top) top = v;
    if(top < .01) return null;                                       // nothing heard
    const thr = top * .12; let a = rms.findIndex(v => v > thr), b = n - 1; while(b > a && rms[b] <= thr) b--;
    const from = Math.max(0, (a - 8) * fr), to = Math.min(x.length, (b + 12) * fr), seg = x.subarray(from, to);
    let pk = 0, ss = 0, nv = 0; for(const v of seg){ const m = Math.abs(v); if(m > pk) pk = m; if(m > .01){ ss += v*v; nv++; } }
    const gain = Math.min(.08 / Math.sqrt(ss / Math.max(1, nv)), .9 / Math.max(pk, 1e-6));
    const out = new DataView(new ArrayBuffer(44 + seg.length * 2)), W = (o, t) => { for(let i = 0; i < t.length; i++) out.setUint8(o + i, t.charCodeAt(i)); };
    W(0, 'RIFF'); out.setUint32(4, 36 + seg.length * 2, true); W(8, 'WAVE'); W(12, 'fmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true);
    out.setUint16(22, 1, true); out.setUint32(24, sr, true); out.setUint32(28, sr * 2, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true);
    W(36, 'data'); out.setUint32(40, seg.length * 2, true);
    for(let i = 0; i < seg.length; i++) out.setInt16(44 + i * 2, Math.max(-1, Math.min(1, seg[i] * gain)) * 32767, true);
    return new Blob([out], {type:'audio/wav'});
  } finally { try{ c.close(); }catch(e){} }
}
const famWords = () => (S.family || []).filter(f => FAM[f.k]).map(f => ({k:f.k, p:f.p || '🏡', en:f.en || '', t:'family', phrase:true}));

/* ---------- hear yourself ----------
   In phrase practice the child can record their try (up to 6 s) and hear it right away, then the model again. */
const MIC = '<span class="emo">🎤</span>', EAR = '<span class="emo">👂</span>';
let REC = null;
const canRecord = () => !!(window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
function stopRecorder(){ if(!REC) return; clearTimeout(REC.t); try{ if(REC.mr.state !== 'inactive') REC.mr.stop(); }catch(e){} }
/* o.max: longest take (ms); o.model: said again right after the child's own voice, so they hear the difference;

function syncText(err){
  if(!syncReady()) return 'Sync between devices is not set up yet.';
  if(!S.sync) return 'Keep progress the same on iPhone and iPad: turn on sync here, then type the family code on the other device.';
  const ago = S.syncAt ? Math.round((Date.now() - new Date(S.syncAt)) / 60000) : null;
  return `Family code <b class="code">${S.sync}</b> · ${err || (ago === null ? 'not synced yet' : ago < 1 ? 'synced just now' : `synced ${ago} min ago`)}`;
}
function bindSync(){
  const on = $('#syncOn'), join = $('#syncJoin'), off = $('#syncOff');
  if(on) on.onclick = async () => { on.disabled = true; if(await syncStart(newCode(), false)){ go('parent'); toast('<span>Sync is on</span>'); } else on.disabled = false; };
  if(join) join.onclick = async () => { const c = cleanCode($('#syncCode').value); if(c.length !== 14){ toast('<span>The code has 12 letters and numbers</span>'); return; }
    join.disabled = true; if(await syncStart(c, true)){ go('parent'); toast('<span>Joined: progress synced</span>'); } else join.disabled = false; };
  if(off) off.onclick = () => { S.sync = null; S.syncAt = null; save(); go('parent'); toast('<span>Sync is off on this device</span>'); };
}
addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden'){ clearTimeout(syncT); syncNow(); } else syncSoon(); });
addEventListener('online', syncSoon);
setTimeout(syncNow, 1200);

/* ---------- boot ---------- */
loadFamily();
$('#hmSlot').innerHTML = hanamaru(30);
$('#homeBtn').onclick = () => { sfx.tap(); go(up()); };
$('#lockBtn').onclick = openGate;
/* the speed bar: one handler for every bar on the page; moving it replays the last word at the new speed */
view.addEventListener('input', e => { if(!e.target.classList.contains('spd')) return;
  S.settings.speed = +e.target.value; save(); sfx.tap(); if(lastSaid) say(lastSaid); else say('こんにちは'); });
$('#soundWarn').onclick = soundHelp;
go('home');
/* offline: sw.js keeps a copy of the app (and its fonts) on the device after the first visit */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.addEventListener('message', e => { if(e.data && e.data.type === 'clips'){ OFFLINE = {...OFFLINE, ...e.data}; const el = $('#offRow'); if(el) el.textContent = offlineText(); } });
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(reg => { OFFLINE.on = true;
    const urls = [...new Set(Object.values(CLIPS).filter(u => !u.startsWith('data:')))]; OFFLINE.total = urls.length;
    if(reg.active && urls.length) reg.active.postMessage({type:'save-clips', urls}); }).catch(() => {});
}
function offlineText(){ const o = OFFLINE; if(!o.on) return 'Offline copy: not available in this browser.';
  return o.total && o.done >= o.total ? `Ready offline · all ${o.total} voice clips saved on this device` : `Saving voice clips for offline… ${o.total ? Math.round(o.done / o.total * 100) : 0}%`; }
